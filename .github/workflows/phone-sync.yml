name: Ellie phone sync
on:
  schedule:
    # Melissa, 2026-09-28: midday landed after 6 PM once — GitHub delays its own schedule crons hardest
    # exactly on the hour/half-hour (confirmed: today's on-the-hour backup fired ~5h late). Off by a few
    # minutes on purpose. Shift all three +1h UTC when DST ends in Nov.
    - cron: '34 10 * * *'  # 6:34am ET (EDT).
    - cron: '4 17 * * *'   # 1:04pm ET (EDT), light midday: stops early when nothing new
    - cron: '34 20 * * *'  # 4:34pm ET (EDT), end-of-day wrap
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = change nothing, just report"
        default: "0"
      light:
        description: "1 = midday: stop early when there are no new captures"
        default: "0"
permissions:
  contents: write
concurrency:
  group: ellie-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client google-auth markdown
      - run: python scripts/phone_sync.py
        env:
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          LIGHT: ${{ inputs.light || (github.event.schedule == '4 17 * * *' && '1') || '0' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit vault changes
        if: ${{ (inputs.dry_run || '0') != '1' }}
        run: |
          git config user.name "Ellie"
          git config user.email "ellie@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Phone sync $(date -u +%F)"
          n=0
          until git pull --rebase origin main && git push origin HEAD:main; do
            git rebase --abort 2>/dev/null || true
            n=$((n + 1))
            [ $n -ge 3 ] && echo "Push failed after $n attempts" >&2 && exit 1
            sleep $((n * 2))
          done
