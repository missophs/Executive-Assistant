name: Ellie phone sync
on:
  schedule:
    - cron: '30 10 * * *'  # 6:30am ET (EDT). Shift +1h UTC when DST ends in Nov.
    - cron: '30 20 * * *'  # 4:30pm ET (EDT), end-of-day wrap
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = change nothing, just report"
        default: "1"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client google-auth
      - run: python scripts/phone_sync.py
        env:
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit vault changes
        if: ${{ (inputs.dry_run || '0') != '1' }}
        run: |
          git config user.name "Ellie"
          git config user.email "ellie@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Phone sync $(date -u +%F)" && git push)
