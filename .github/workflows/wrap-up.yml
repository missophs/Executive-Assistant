name: Ellie wrap-up
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = build the email but do not send"
        default: "0"
  schedule:
    # Melissa, 2026-09-28: wrap-up should land between 5:00 and 5:30 PM ET, not 4:45. Off-the-hour times on
    # purpose — GitHub's own schedule crons get delayed hardest exactly on the hour/half-hour (confirmed
    # today: the old 17:00/17:45 UTC backups actually fired ~5h late, past 6 PM). Shift all three +1h UTC when DST ends in Nov.
    - cron: '4 21 * * *'   # 21:04 UTC = 5:04 PM EDT, primary fallback in case cron-job.org's ping is missing.
    - cron: '17 21 * * *'  # 21:17 UTC = 5:17 PM EDT, backup.
    - cron: '29 21 * * *'  # 21:29 UTC = 5:29 PM EDT, last-chance backup, still inside the 5:00-5:30 window.
permissions:
  contents: write
concurrency:
  group: ellie-wrapup
  cancel-in-progress: false
jobs:
  wrap-up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if wrap-up already sent today
        id: guard
        run: |
          git pull origin main --quiet
          TODAY=$(TZ=America/New_York date +'%Y-%m-%d')
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.dry_run }}" = "1" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ -f .last_wrapup_date ] && [ "$(cat .last_wrapup_date)" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=America/New_York date +'%H%M')" -lt "1700" ]; then
            # Backup cron fired before 5:00 PM ET: skip so it cannot send early. workflow_dispatch
            # (cron-job.org's 5:00 PM ET trigger, or a manual run) always proceeds.
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-api-python-client google-auth
        if: steps.guard.outputs.skip != 'true'
      - name: Build and send wrap-up
        if: steps.guard.outputs.skip != 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python -u scripts/wrap_up.py
      - name: Commit guard file
        if: steps.guard.outputs.skip != 'true' && inputs.dry_run != '1'
        run: |
          echo "${{ steps.guard.outputs.today }}" > .last_wrapup_date
          git config user.name "Ellie"
          git config user.email "ellie@users.noreply.github.com"
          git add .last_wrapup_date
          git diff --staged --quiet || git commit -m "Wrap-up sent ${{ steps.guard.outputs.today }}"
          n=0
          until git pull --rebase origin main && git push origin HEAD:main; do
            git rebase --abort 2>/dev/null || true
            n=$((n + 1))
            [ $n -ge 3 ] && echo "Push failed after $n attempts" >&2 && exit 1
            sleep $((n * 2))
          done
      - name: Notify on failure
        if: failure()
        continue-on-error: true
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python scripts/wrap_up.py alert
